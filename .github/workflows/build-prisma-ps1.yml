name: Build PRISMA-PI PS1

on:
  push:
    paths:
      - "projects/prisma/ps1/**"
      - ".github/workflows/build-prisma-ps1.yml"
  pull_request:
    paths:
      - "projects/prisma/ps1/**"
      - ".github/workflows/build-prisma-ps1.yml"
  workflow_dispatch:

jobs:
  build-v1-night:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip ninja-build cmake

      - name: Download official PSn00bSDK v0.24 toolchain
        run: |
          curl -L --fail \
            -o /tmp/gcc-mipsel.zip \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/gcc-mipsel-none-elf-12.3.0-linux.zip

          curl -L --fail \
            -o /tmp/psn00bsdk.zip \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip

          mkdir -p "$HOME/ps1/gcc" "$HOME/ps1/sdk"
          unzip -q /tmp/gcc-mipsel.zip -d "$HOME/ps1/gcc"
          unzip -q /tmp/psn00bsdk.zip -d "$HOME/ps1/sdk"

      - name: Resolve SDK paths
        shell: bash
        run: |
          GCC="$(find "$HOME/ps1/gcc" -type f -name mipsel-none-elf-gcc | head -1)"
          SDK_CMAKE="$(find "$HOME/ps1/sdk" -type f -path '*/lib/libpsn00b/cmake/sdk.cmake' | head -1)"
          MKPSXISO="$(find "$HOME/ps1/sdk" -type f -name mkpsxiso | head -1)"

          test -n "$GCC"
          test -n "$SDK_CMAKE"
          test -n "$MKPSXISO"

          echo "$(dirname "$GCC")" >> "$GITHUB_PATH"
          echo "$(dirname "$MKPSXISO")" >> "$GITHUB_PATH"
          echo "SDK_CMAKE=$SDK_CMAKE" >> "$GITHUB_ENV"
          echo "PSN00BSDK_LIBS=$(dirname "$(dirname "$SDK_CMAKE")")" >> "$GITHUB_ENV"

      - name: Build V1-NIGHT from PSn00bSDK
        run: |
          cmake \
            -S projects/prisma/ps1/V1-NIGHT \
            -B build/V1-NIGHT \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SDK_CMAKE"

          cmake --build build/V1-NIGHT

      - name: Prepare short artifact names
        shell: bash
        run: |
          mkdir -p dist/V1-NIGHT

          cp build/V1-NIGHT/v1night.exe dist/V1-NIGHT/V1-NIGHT.exe
          cp build/V1-NIGHT/v1night.bin dist/V1-NIGHT/V1-NIGHT.bin

          sed 's/v1night\.bin/V1-NIGHT.bin/g' \
            build/V1-NIGHT/v1night.cue \
            > dist/V1-NIGHT/V1-NIGHT.cue

          cp projects/prisma/ps1/V1-NIGHT/README.md dist/V1-NIGHT/README.md
          sha256sum dist/V1-NIGHT/V1-NIGHT.* > dist/V1-NIGHT/SHA256.txt

          ls -lh dist/V1-NIGHT

      - name: Upload V1-NIGHT
        uses: actions/upload-artifact@v4
        with:
          name: V1-NIGHT
          path: dist/V1-NIGHT/
          if-no-files-found: error
