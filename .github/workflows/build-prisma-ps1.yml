name: Build PRISMA-PI PS1

on:
  push:
    paths:
      - "projects/prisma/ps1/**"
      - ".github/workflows/build-prisma-ps1.yml"
  workflow_dispatch:

jobs:
  build-v1-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip ninja-build

      - name: Download official PSn00bSDK v0.24 toolchain
        run: |
          curl -L --fail \
            -o /tmp/gcc-mipsel.zip \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/gcc-mipsel-none-elf-12.3.0-linux.zip

          curl -L --fail \
            -o /tmp/psn00bsdk.zip \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip

          mkdir -p "$HOME/ps1/gcc" "$HOME/ps1/sdk"
          unzip -q /tmp/gcc-mipsel.zip -d "$HOME/ps1/gcc"
          unzip -q /tmp/psn00bsdk.zip -d "$HOME/ps1/sdk"

      - name: Resolve official SDK paths
        shell: bash
        run: |
          GCC="$(find "$HOME/ps1/gcc" -type f -name mipsel-none-elf-gcc | head -1)"
          SDK_CMAKE="$(find "$HOME/ps1/sdk" -type f -path '*/lib/libpsn00b/cmake/sdk.cmake' | head -1)"
          MKPSXISO="$(find "$HOME/ps1/sdk" -type f -name mkpsxiso | head -1)"

          test -n "$GCC"
          test -n "$SDK_CMAKE"
          test -n "$MKPSXISO"

          echo "$(dirname "$GCC")" >> "$GITHUB_PATH"
          echo "$(dirname "$MKPSXISO")" >> "$GITHUB_PATH"
          echo "SDK_CMAKE=$SDK_CMAKE" >> "$GITHUB_ENV"
          echo "PSN00BSDK_LIBS=$(dirname "$(dirname "$SDK_CMAKE")")" >> "$GITHUB_ENV"

      - name: Build V1-BOOT from PSn00bSDK hello
        run: |
          cmake \
            -S projects/prisma/ps1/V1-BOOT \
            -B build/V1-BOOT \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SDK_CMAKE"

          cmake --build build/V1-BOOT
          find build/V1-BOOT -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Prepare short artifact names
        shell: bash
        run: |
          mkdir -p dist/V1-BOOT
          cp build/V1-BOOT/v1boot.exe dist/V1-BOOT/V1-BOOT.exe
          cp build/V1-BOOT/v1boot.bin dist/V1-BOOT/V1-BOOT.bin
          sed 's/v1boot\.bin/V1-BOOT.bin/g' \
            build/V1-BOOT/v1boot.cue \
            > dist/V1-BOOT/V1-BOOT.cue
          ls -lh dist/V1-BOOT

      - name: Upload V1-BOOT
        uses: actions/upload-artifact@v4
        with:
          name: V1-BOOT
          path: dist/V1-BOOT/
          if-no-files-found: error
